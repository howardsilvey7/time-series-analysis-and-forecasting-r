@'
name: R Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    # Normal successful runs complete much faster, but GitHub-hosted
    # R setup can occasionally be slow. Allow sufficient provisioning time.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install pak
        shell: Rscript {0}
        run: |
          install.packages(
            "pak",
            repos = sprintf(
              "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
              .Platform$pkgType,
              R.Version()$os,
              R.Version()$arch
            )
          )

      - name: Install required R packages
        shell: Rscript {0}
        run: |
          pak::pkg_install(c(
            "astsa",
            "forecast",
            "tseries"
          ))

      - name: Run complete analysis
        shell: Rscript {0}
        run: |
          source("scripts/run-all.R")
'@ | Set-Content .\.github\workflows\r-analysis.yml -Encoding UTF8
