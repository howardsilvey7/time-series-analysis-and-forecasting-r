name: R Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install pak
        run: |
          install.packages(
            "pak",
            repos = sprintf(
              "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
              .Platform$pkgType,
              R.Version()$os,
              R.Version()$arch
            )
          )
        shell: Rscript {0}

      - name: Install required R packages
        run: |
          pak::pkg_install(c(
            "astsa",
            "forecast",
            "tseries"
          ))
        shell: Rscript {0}

      - name: Run complete analysis
        run: |
          source("scripts/run-all.R")
        shell: Rscript {0}
